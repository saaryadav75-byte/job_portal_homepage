<!DOCTYPE html>
<html>
<head>
<title>Expense Tracker</title>
</head>

<body>

<h2>Expense Tracker</h2>

<!-- Input Fields -->
Expense Name:
<input type="text" id="name"><br><br>

Amount:
<input type="number" id="amount"><br><br>

Category:
<select id="category">
<option>Food</option>
<option>Travel</option>
<option>Shopping</option>
</select>
<br><br>

<!-- Buttons -->
<button onclick="addExpense()">Add Expense</button>
<button onclick="updateExpense()">Update Expense</button>

<h3>Expense List</h3>

<ul id="list"></ul>

<h3>Total Expense: <span id="total">0</span></h3>


<script>

let expenses = [];
let editIndex = -1;

function addExpense(){

let name = document.getElementById("name").value;
let amount = document.getElementById("amount").value;
let category = document.getElementById("category").value;

let expense = {
name:name,
amount:Number(amount),
category:category
};

expenses.push(expense);

displayExpenses();
calculateTotal();

}

function displayExpenses(){

let list = document.getElementById("list");
list.innerHTML = "";

for(let i=0;i<expenses.length;i++){

let li = document.createElement("li");

li.innerHTML =
expenses[i].name + " - " +
expenses[i].amount + " - " +
expenses[i].category +
" <button onclick='editExpense("+i+")'>Edit</button>" +
" <button onclick='deleteExpense("+i+")'>Delete</button>";

list.appendChild(li);

}

}

function deleteExpense(index){

expenses.splice(index,1);

displayExpenses();
calculateTotal();

}

function editExpense(index){

let e = expenses[index];

document.getElementById("name").value = e.name;
document.getElementById("amount").value = e.amount;
document.getElementById("category").value = e.category;

editIndex = index;

}

function updateExpense(){

if(editIndex >= 0){

expenses[editIndex].name =
document.getElementById("name").value;

expenses[editIndex].amount =
Number(document.getElementById("amount").value);

expenses[editIndex].category =
document.getElementById("category").value;

displayExpenses();
calculateTotal();

editIndex = -1;

}

}

function calculateTotal(){

let total = 0;

for(let i=0;i<expenses.length;i++){
total += expenses[i].amount;
}

document.getElementById("total").innerText = total;

}

</script>

</body>
</html>
